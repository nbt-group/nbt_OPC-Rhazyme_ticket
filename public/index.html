/* Layout: one work column. Header, one line of instructions, status tabs, then one table row per ticket.

  --stop-line: #F5C2BD;
  color-scheme: light;
  --font-text: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-head: "Plus Jakarta Sans", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
body {

.row, .head { display: grid; gap: 8px 16px; padding: 14px 16px; align-items: center; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "no status" "cust cust" "po po" "act act"; }

      var at = new Date().toISOString();
      var ins = await sb.from(TABLE).update(
        { receipt_path: path, receipt_name: file.name, receipt_type: type, receipt_uploaded_at: at }).eq('issue_key', id).select('issue_key');
      if (ins.error) throw ins.error;
      if (!ins.data || !ins.data.length) throw new Error('Ticket not found or no permission to update.');
      t.receipt = { path: path, name: file.name, type: type, at: Date.parse(at) };
    } catch (e) {
      notify('Upload failed: ' + ((e && (e.message || e.code)) || 'please try again.'), true);
    } finally {
      busy.delete(id); render();
    }
  }

  async function viewReceipt(r) {
    var w = window.open('', '_blank');
    var res = await sb.storage.from(BUCKET).createSignedUrl(r.path, 300);
    if (res.error || !res.data) {
      if (w) w.close();
      notify('Cannot open receipt: ' + ((res.error && res.error.message) || 'please try again.'), true);
      return;
    }
    if (w) w.location.href = res.data.signedUrl; else location.href = res.data.signedUrl;
  }

  async function signOut() {
    await sb.auth.signOut();
    tickets = []; mode = 'login'; render();
  }

  /* ---------- render ---------- */
  function pill(st) {
    if (st === 'done') return el('span', { class: 'pill old', text: 'Done' });
    return el('span', { class: 'pill ' + (st === 'received' ? 'go' : 'stop'), text: st === 'received' ? '✓ Received' : '✕ Not received' });
  }

  function head() {
    return el('li', { class: 'head', 'aria-hidden': 'true' },
      el('span', { class: 'c-no', text: 'Ticket' }),
      el('span', { class: 'c-cust', text: 'Customer' }),
      el('span', { class: 'c-po', text: 'PO' }),
      el('span', { class: 'c-status', text: 'Status' }),
      el('span', { class: 'c-act' }));
  }

  function row(t) {
    var st = stageOf(t);
    var off = busy.has(t.id);
    var r = t.receipt;
    var acts = [];
    if (st === 'done') {
      /* old order: nothing to do */
    } else if (st === 'missing') {
      acts.push(el('button', { type: 'button', class: 'btn primary', disabled: off, onclick: function () { pickFile(t.id); } }, 'Upload receipt'));
    } else {
      acts.push(el('button', { type: 'button', class: 'btn', title: r.name, onclick: function () { viewReceipt(r); } }, 'View receipt'));
      acts.push(el('button', { type: 'button', class: 'btn', disabled: off, onclick: function () { pickFile(t.id); } }, 'Replace'));
    }
    return el('li', { class: 'row ' + (st === 'received' ? 'go' : 'stop') },
      el('div', { class: 'c-no' },
        el('div', { class: 'no', text: t.no || t.id }),
        t.sample ? el('span', { class: 'tag-sample', text: 'Sample' }) : null),
      el('div', { class: 'c-cust' },
        el('div', { class: 'cust', text: t.customer || '' }),
        el('div', { class: 'prod', text: t.product || '' })),
      el('div', { class: 'c-po' }, el('span', { class: 'lbl', text: 'PO' }), t.poLink ? el('a', { class: 'num polink', href: t.poLink, target: '_blank', rel: 'noopener noreferrer', text: (t.opc || 'View PO') + ' ↗' }) : el('span', { class: 'num', text: t.opc || '-' })),
      el('div', { class: 'c-status' },
        pill(st),
        el('div', { class: 'sub' + (st === 'missing' ? ' stop' : ''), text: st === 'received' ? 'OK to deliver · ' + fmt(r.at) : st === 'done' ? 'Old order' : 'Do not deliver' })),
      el('div', { class: 'c-act' }, acts));
  }

  function render() {
    document.body.classList.toggle('is-login', mode === 'login');
    $('#login').hidden = mode !== 'login';
    $('#app').hidden = mode === 'login';
    var perm = $('#permNote');
    if (mode === 'login') {
      perm.textContent = 'Sign in to see tickets and upload receipts.';
      perm.hidden = false;
    } else {
      perm.hidden = true;
    }

    var counts = { all: tickets.length, missing: 0, received: 0, done: 0 };
    tickets.forEach(function (t) { counts[stageOf(t)]++; });
    var ICON = {
      all: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h10M9 12h10M9 19h10M4 5h.01M4 12h.01M4 19h.01"/></svg>',
      missing: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
      done: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
      received: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>'
    };
    var stats = $('#stats');
    stats.replaceChildren();
    [['all', 'Total tickets', ''], ['missing', 'Not received', ' s-stop'], ['received', 'Received', ' s-go'], ['done', 'Done (old)', ' s-done']].forEach(function (x) {
      var ic = el('div', { class: 'ic' }); ic.innerHTML = ICON[x[0]];
      stats.append(el('div', { class: 'stat' + x[2] }, ic, el('div', {}, el('b', { text: String(counts[x[0]]) }), el('span', { text: x[1] }))));
    });
    var chips = FILTERS.map(function (f) {
      return el('button', { type: 'button', class: 'chip', 'aria-pressed': String(filter === f[0]), onclick: function () { filter = f[0]; render(); } },
        f[1], el('i', { text: String(counts[f[0]]) }));
    });
    $('#chips').replaceChildren.apply($('#chips'), chips);

    var q = query.trim().toLowerCase();
    var vis = tickets.filter(function (t) {
      if (filter !== 'all' && stageOf(t) !== filter) return false;
      if (!q) return true;
      return [t.no, t.id, t.opc, t.customer, t.product, t.summary].some(function (x) { return String(x || '').toLowerCase().indexOf(q) >= 0; });
    });
    vis.sort(function (a, b) {
      var d = (stageOf(a) === 'missing' ? 0 : 1) - (stageOf(b) === 'missing' ? 0 : 1);
      return d !== 0 ? d : (b.createdAt || 0) - (a.createdAt || 0);
    });

    var list = $('#list');
    list.replaceChildren();
    if (mode === 'loading') {
      list.append(el('li', { class: 'empty', text: 'Loading…' }));
    } else if (!tickets.length) {
      list.append(el('li', { class: 'empty', text: loadError || 'No tickets yet.' }));
    } else if (!vis.length) {
      list.append(el('li', { class: 'empty', text: 'No tickets match.' }));
    } else {
      list.append(head());
      vis.forEach(function (t) { list.append(row(t)); });
    }

    var foot = $('#foot');
    foot.replaceChildren();
    if (mode === 'demo') {
      foot.append('Sample data. Changes in this preview are not saved.');
    } else if (mode === 'db') {
      foot.append(tickets.length + (tickets.length === 1 ? ' ticket' : ' tickets'));
    }
  }

  /* ---------- wiring ---------- */
  $('#outBtn').addEventListener('click', signOut);
  $('#q').addEventListener('input', function (e) { query = e.target.value; render(); });
  $('#login').addEventListener('submit', async function (e) {
    e.preventDefault();
    var b = e.currentTarget.querySelector('button[type=submit]');
    b.disabled = true; b.textContent = 'Signing in…';
    var r = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    b.disabled = false; b.textContent = 'Sign in';
    if (r.error) {
      notify(/invalid login/i.test(r.error.message) ? 'Wrong email or password. Please try again.' : 'Sign in failed: ' + r.error.message, true);
      return;
    }
    $('#pw').value = '';
    load();
  });
  $('#file').addEventListener('change', function (e) { handleFile(e.target.files && e.target.files[0]); });

  /* ---------- start ---------- */
  async function init() {
    render();
    if (!window.supabase) { notify('Cannot load the Supabase library. Check your connection.', true); return; }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    var s = await sb.auth.getSession();
    if (s.data && s.data.session) { await load(); } else { mode = 'login'; render(); }
  }
  init();
})();
</script>

</body></html>
